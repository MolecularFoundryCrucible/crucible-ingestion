[project]
name = "crucible-ingestion"
version = "0.1.0"
description = "Metadata parsing from data files into the Crucible Data Platform"
readme = "README.md"
requires-python = ">=3.11"

# Parsing only. Nothing here reaches RabbitMQ or Google Cloud.
dependencies = [
    "aicspylibczi>=3.3.1",
    "h5py>=3.16.0",
    "hyperspy>=2.4.0",
    "igor2>=0.5.13",
    "matplotlib>=3.10.8",
    "nano-crucible>=3.1.0",
    "ncempy>=1.15",
    "numpy",
    "orjson>=3.9",
    "pandas>=3.0.3",
    "pillow>=12.1.1",
    "pyyaml>=6.0.3",
    "requests",
    "xmltodict>=1.0.4",
]

[project.scripts]
crucible-ingest = "crucible_ingestion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crucible_ingestion"]

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "jsonschema>=4.23.0",
    "pytest>=9.0.2",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
